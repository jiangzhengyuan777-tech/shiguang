# ========================================
# 拾光 · 一键部署（MySQL + Redis + FastAPI + Nginx）
# 使用：docker compose up -d --build
# 访问：http://localhost:8080
# ========================================

services:
  # ---------- MySQL ----------
  mysql:
    image: mysql:8.0
    container_name: shiguang-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ai_writer
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=200
      - --innodb_buffer_pool_size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - shiguang

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: shiguang-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - shiguang

  # ---------- 后端 FastAPI ----------
  backend:
    build:
      context: ./server
    image: shiguang-backend:latest
    container_name: shiguang-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: "8667"
      SERVER_HOST: "0.0.0.0"

      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ai_writer
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ""

      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-shiguang-prod-secret-key}
      PASSWORD_SALT: yupi

      # AI（OpenAI 兼容，默认 DeepSeek）
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-sk-placeholder}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://api.deepseek.com/v1}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-deepseek-chat}

      # 配图（可选，留空会走随机图兜底）
      PEXELS_API_KEY: ${PEXELS_API_KEY:-placeholder}
      NANO_BANANA_API_KEY: ${NANO_BANANA_API_KEY:-placeholder}
      TENCENT_COS_SECRET_ID: ${TENCENT_COS_SECRET_ID:-placeholder}
      TENCENT_COS_SECRET_KEY: ${TENCENT_COS_SECRET_KEY:-placeholder}
      TENCENT_COS_REGION: ${TENCENT_COS_REGION:-ap-guangzhou}
      TENCENT_COS_BUCKET: ${TENCENT_COS_BUCKET:-placeholder-bucket}
      TENCENT_COS_DOMAIN: ""

      # 支付（可选）
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

      # 容器内不走代理
      NO_PROXY: "localhost,127.0.0.1,mysql,redis"
      no_proxy: "localhost,127.0.0.1,mysql,redis"
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shiguang

  # ---------- 前端 Nginx ----------
  frontend:
    build:
      context: ./web
    image: shiguang-frontend:latest
    container_name: shiguang-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - shiguang

networks:
  shiguang:
    driver: bridge
    name: shiguang-net

volumes:
  mysql-data:
    name: shiguang-mysql-data
  redis-data:
    name: shiguang-redis-data
